name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Slint 1.19 needs Rust 1.95.
      - name: Set up Rust 1.95.0
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0

      - run: node --check scripts/build.js
      - run: node --check scripts/cargo-test.js

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - run: npm test
